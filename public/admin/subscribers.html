<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="16x16" />
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="MWA Admin" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1B1214" />
<title>Subscribers — Movies with Avi</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Spline+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --red:#C0392E; --dark:#1B1214; --cream:#F6EFE4; --ink:#2A1E1B; --soft:#6B5A52; --butter:#F2B838; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--cream); color: var(--ink); font: 15px/1.5 "Bricolage Grotesque", sans-serif; padding: 26px 20px 96px; }
.wrap { max-width: 820px; margin: 0 auto; }
h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.01em; }
h1 span { color: var(--red); }
.sub { color: var(--soft); margin: 4px 0 22px; }
.gate { max-width: 380px; margin: 60px auto; text-align: center; }
.gate input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid rgba(42,30,27,.2); font: inherit; margin: 14px 0 10px; }
button { background: var(--red); color: #fff; border: none; border-radius: 10px; padding: 11px 20px; font: 700 .95rem "Bricolage Grotesque"; cursor: pointer; }
button:disabled { opacity: .55; }
button.ghost { background: #fff; color: var(--ink); border: 1.5px solid rgba(42,30,27,.2); }
.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.bar .count { font-family: "Spline Sans Mono"; font-weight: 600; font-size: 1.35rem; margin-right: auto; }
.bar .count small { font: .78rem "Spline Sans Mono"; color: var(--soft); text-transform: uppercase; letter-spacing: .06em; display: block; }
.panel { background: #fff; border-radius: 14px; padding: 6px 4px; border: 1px solid rgba(42,30,27,.08); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; vertical-align: top; }
th { font: 600 .7rem "Spline Sans Mono"; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); border-bottom: 1.5px solid rgba(42,30,27,.12); }
td { border-top: 1px solid rgba(42,30,27,.07); }
tr:first-child td { border-top: none; }
td.email { font-family: "Spline Sans Mono"; font-size: .85rem; }
td.src, td.day { color: var(--soft); font: .8rem "Spline Sans Mono"; white-space: nowrap; }
.badge { font: 600 .66rem "Spline Sans Mono"; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: #EEE6D8; color: var(--soft); text-transform: uppercase; }
.empty { color: var(--soft); padding: 22px 12px; }
.err { color: var(--red); font-weight: 600; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(-140%); top: calc(10px + env(safe-area-inset-top));
  z-index: 200; background: var(--dark); color: var(--cream); padding: 12px 20px; border-radius: 999px;
  font: 700 .9rem "Bricolage Grotesque"; box-shadow: 0 8px 26px rgba(27,18,20,.34);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* --- admin nav --- */
.adminnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--dark); display: flex; justify-content: space-around;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 18px rgba(27,18,20,.28); }
.adminnav a { color: var(--cream); opacity: .75; text-decoration: none; text-align: center;
  font: 600 .72rem "Spline Sans Mono", monospace; letter-spacing: .04em; padding: 4px 14px; border-radius: 10px; }
.adminnav a .ico { display: block; font-size: 1.25rem; margin-bottom: 2px; }
.adminnav a.on { opacity: 1; color: var(--butter); background: rgba(242,184,56,.12); }
</style>
</head>
<body>
<div class="wrap">
  <h1>The <span>mailing list</span></h1>
  <p class="sub">Everyone who signed up for the newsletter, newest first.</p>

  <div class="gate" id="gate">
    <p>Enter the admin key to see the list.</p>
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" />
    <button id="go">Open the list</button>
    <p class="err" id="err"></p>
  </div>

  <div id="view" style="display:none">
    <div class="bar">
      <div class="count"><span id="count">–</span><small>Subscribers</small></div>
      <button class="ghost" id="copy" type="button">Copy emails</button>
      <button id="csv" type="button">Export CSV</button>
    </div>
    <div class="panel">
      <table id="tbl"><tbody></tbody></table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let KEY = sessionStorage.getItem('avi-admin-key') || '';
let SUBS = [];

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window._t); window._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function render() {
  $('count').textContent = SUBS.length.toLocaleString();
  const body = $('tbl').querySelector('tbody');
  if (!SUBS.length) {
    body.innerHTML = '<tr><td class="empty">No subscribers yet — they\'ll appear here as readers sign up.</td></tr>';
    $('copy').disabled = $('csv').disabled = true;
    return;
  }
  $('copy').disabled = $('csv').disabled = false;
  body.innerHTML =
    '<tr><th>Name</th><th>Email</th><th>Source</th><th>Joined</th></tr>' +
    SUBS.map(s => `<tr>
      <td>${esc(s.name) || '<span style="color:var(--soft)">—</span>'}</td>
      <td class="email">${esc(s.email)}</td>
      <td class="src">${s.source ? `<span class="badge">${esc(s.source)}</span>` : '—'}</td>
      <td class="day">${esc(s.day)}</td>
    </tr>`).join('');
}

async function load() {
  const r = await fetch(`/api/admin/subscribers?key=${encodeURIComponent(KEY)}`);
  if (!r.ok) { sessionStorage.removeItem('avi-admin-key'); $('err').textContent = 'Wrong key.'; return false; }
  const d = await r.json();
  SUBS = Array.isArray(d.subscribers) ? d.subscribers : [];
  $('gate').style.display = 'none'; $('view').style.display = '';
  render();
  return true;
}

$('go').onclick = async () => { KEY = $('key').value.trim(); if (await load()) sessionStorage.setItem('avi-admin-key', KEY); };
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

// Copy all emails, comma-separated, for pasting into an email tool.
$('copy').onclick = async () => {
  const emails = SUBS.map(s => s.email).filter(Boolean).join(', ');
  try { await navigator.clipboard.writeText(emails); toast(`Copied ${SUBS.length} email${SUBS.length === 1 ? '' : 's'}`); }
  catch { toast('Copy failed — try Export CSV'); }
};

// Export a spreadsheet-friendly CSV.
$('csv').onclick = () => {
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [['email', 'name', 'source', 'joined'],
    ...SUBS.map(s => [s.email, s.name, s.source, s.day])];
  const csv = rows.map(r => r.map(q).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `mwa-subscribers-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('CSV downloaded');
};

if (KEY) load();
</script>

<nav class="adminnav">
  <a href="/admin"><span class="ico">🎟️</span>BOOTH</a>
  <a href="/admin/publish"><span class="ico">✍️</span>WRITE</a>
  <a href="/admin/reviews"><span class="ico">🎞️</span>VAULT</a>
  <a href="/admin/subscribers" class="on"><span class="ico">✉️</span>SUBS</a>
</nav>
</body>
</html>
